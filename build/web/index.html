<!DOCTYPE html>
<html>

<head>

    For more details:

  <meta charset="UTF-8">

  <meta name="keywords"
    content="NovusTech, IoT, App Development, Website Development, Startup Consulting, Flutter, Tech Agency">

    content="We build next-gen IoT safety systems and scalable mobile & web solutions for forward-thinking startups.">

  <meta name="mobile-web-app-capable" content="yes">

  <style>
    body {
      background-color: #0F172A;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: 'Outfit', sans-serif;
    }
    /* Modern sleek scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #0F172A;
    }
    ::-webkit-scrollbar-thumb {
      background: #3B82F6;
      border-radius: 5px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #60A5FA;
